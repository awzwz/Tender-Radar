# Production stack for a single EC2 instance (AWS free tier t3.micro).
# DB stays on Supabase; frontend stays on Vercel. This runs only the backend
# side: Redis + FastAPI + Celery worker + Celery beat, behind Caddy (auto-HTTPS).
#
# Usage (on the EC2 box, from repo root):
#   cp .env.example .env   # then fill real values (or scp the prepared .env)
#   export DOMAIN=api.your-domain.com   # must point to this instance's public IP
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Lean by design for 1 GB RAM: 2 uvicorn workers, Celery concurrency 1.

services:
  redis:
    image: redis:7-alpine
    container_name: tr_redis
    command: redis-server --save 60 1 --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: tr_backend
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - APP_ENV=production
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    # Only the backend runs migrations; workers must not.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    restart: unless-stopped

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: tr_worker
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.etl.tasks:celery_app worker --loglevel=info --concurrency=1
    restart: unless-stopped

  beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: tr_beat
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.etl.tasks:celery_app beat --loglevel=info
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: tr_caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  caddy_data:
  caddy_config:
