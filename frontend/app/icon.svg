<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="sweep" x1="256" y1="256" x2="256" y2="86" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Brand badge -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Radar rings -->
  <circle cx="256" cy="256" r="150" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="10"/>
  <circle cx="256" cy="256" r="100" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="10"/>
  <circle cx="256" cy="256" r="50"  stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="10"/>

  <!-- Sweep wedge -->
  <path d="M256 256 L256 96 A160 160 0 0 1 396 200 Z" fill="url(#sweep)"/>
  <line x1="256" y1="256" x2="396" y2="200" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>

  <!-- Center + detected blip -->
  <circle cx="256" cy="256" r="16" fill="#FFFFFF"/>
  <circle cx="338" cy="190" r="22" fill="#34D399"/>
  <circle cx="338" cy="190" r="22" fill="#34D399" opacity="0.35"/>
</svg>
