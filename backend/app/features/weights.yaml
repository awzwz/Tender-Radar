# Risk Indicator Weights (sum doesn't need to equal 100)
# Score = sum(weight * flag) normalized to 0-100

indicators:
  LOT_SPLITTING:
    weight: 10
    level_contribution: medium
    description: "Разбивка крупной закупки на мелкие лоты"
    description_en: "Splitting a large procurement into many smaller lots"

  SHORT_DEADLINE:
    weight: 8
    level_contribution: medium
    description: "Срок приёма заявок менее 3 рабочих дней"
    description_en: "Bid submission window is too short (< 3 days)"

  FEW_BIDS:
    weight: 12
    level_contribution: high
    description: "Количество заявок 1-2 при открытом конкурсе"
    description_en: "Very low competition: only 1-2 bids"

  RECURRING_WINNER:
    weight: 15
    level_contribution: high
    description: "Один поставщик выигрывает >70% тендеров у заказчика"
    description_en: "Same supplier repeatedly wins (>70%, min 5 contracts)"

  COMMON_REQUISITES:
    weight: 14
    level_contribution: high
    description: "Участники конкурса имеют общий телефон или email"
    description_en: "Different bidders share contact details (phone/email)"

  NEW_COMPANY_BIG_CONTRACT:
    weight: 12
    level_contribution: high
    description: "Компания зарегистрирована <1 года, контракт >10M"
    description_en: "Recently registered company wins large contract"

  CAROUSEL_PATTERN:
    weight: 15
    level_contribution: high
    description: "Паттерн чередования победителей А→В→С→А (3+ участника)"
    description_en: "Winner rotation pattern between small group (3+ participants)"

  RNU_FLAG:
    weight: 20
    level_contribution: high
    description: "Поставщик в реестре недобросовестных поставщиков"
    description_en: "Supplier is in unreliable suppliers registry (RNU)"

  DUMPING_FLAG:
    weight: 10
    level_contribution: medium
    description: "Зафиксирован демпинг цены"
    description_en: "Strong price dumping detected"

  IDENTICAL_BID_PRICES:
    weight: 10
    level_contribution: medium
    description: "Одинаковые цены у разных участников"
    description_en: "Different suppliers submit identical prices"

  TINY_WIN_MARGIN:
    weight: 10
    level_contribution: medium
    description: "Минимальная разница между лучшей и второй ценой (<1%)"
    description_en: "Very small win margin (< 1%)"

  LATE_BID_SUBMISSION:
    weight: 4
    level_contribution: low
    description: "Все заявки поданы за <60 минут до дедлайна"
    description_en: "All bids submitted very close to deadline (last 60 min)"

  REPEAT_TENDER:
    weight: 4
    level_contribution: low
    description: "Тендер является повторным (есть parentId)"
    description_en: "Tender is a repeat/restart"

  CANCELLED_TENDER:
    weight: 5
    level_contribution: low
    description: "Тендер отменён"
    description_en: "Tender has cancellation records"

  PAUSED_TENDER:
    weight: 4
    level_contribution: low
    description: "Тендер был приостановлен"
    description_en: "Tender was paused"

  NIGHT_OR_WEEKEND_PUBLISH:
    weight: 3
    level_contribution: low
    description: "Публикация в нерабочее время или выходные"
    description_en: "Tender published at unusual time (night/weekend)"

  SHORT_DISCUSSION_WINDOW:
    weight: 6
    level_contribution: low
    description: "Слишком короткий срок обсуждения (<2 дня)"
    description_en: "Discussion window is too short (< 2 days)"

  LAST_MINUTE_CHANGES:
    weight: 10
    level_contribution: medium
    description: "Изменение условий за <24ч до дедлайна"
    description_en: "Tender updated shortly before deadline"

  SUPPLIER_CONCENTRATION:
    weight: 10
    level_contribution: medium
    description: ">80% контрактов поставщика с одним заказчиком"
    description_en: "Supplier depends heavily on one customer"

  CUSTOMER_WINNER_CONCENTRATION:
    weight: 10
    level_contribution: medium
    description: "Топ-3 поставщика получают >80% контрактов клиента"
    description_en: "Customer has very narrow winner set"

  HIGH_WIN_RATE_FEW_BIDS:
    weight: 12
    level_contribution: high
    description: "Win-rate >90% при малом числе заявок (<3)"
    description_en: "Very high win-rate with low average competition"

  ADDENDUM_VALUE_INCREASE:
    weight: 12
    level_contribution: high
    description: "Допсоглашение увеличило сумму >20%"
    description_en: "Contract value increased >20% via addendum"

  WIN_MIN_THEN_ADDENDUM:
    weight: 15
    level_contribution: high
    description: "Допсоглашение в течение 30 дней после подписания"
    description_en: "Quick addendum soon after signing (within 30 days)"

  WEIRD_EXECUTION_TIME:
    weight: 8
    level_contribution: medium
    description: "Аномально короткий (<7д) или длинный (>730д) срок"
    description_en: "Unrealistically short/long execution time"

  HIGH_PREPAY:
    weight: 10
    level_contribution: medium
    description: "Аванс >50% от суммы контракта"
    description_en: "Advance payment > 50% of contract sum"

  PAYMENTS_EXCEED_CONTRACT:
    weight: 15
    level_contribution: high
    description: "Сумма платежей превышает сумму контракта"
    description_en: "Sum of payments exceeds contract value"

  PAYMENT_WITHOUT_ACT:
    weight: 15
    level_contribution: high
    description: "Платежи без акта выполнения работ"
    description_en: "Payments exist but no acceptance acts"

  OVERDUE_EXECUTION:
    weight: 12
    level_contribution: high
    description: "Просрочка исполнения контракта"
    description_en: "Actual completion later than planned"

  FINES_PRESENT:
    weight: 14
    level_contribution: high
    description: "Штрафные санкции в актах"
    description_en: "Fines/penalties exist in acts"

  LOW_EXECUTION_RATE:
    weight: 10
    level_contribution: medium
    description: "Степень исполнения <50%"
    description_en: "Poor execution: factSum < 50% of totalSum"

  BANK_DETAILS_REUSE:
    weight: 12
    level_contribution: high
    description: "Одинаковые банковские реквизиты у разных компаний"
    description_en: "Same bank details across different companies"

  OVERPRICED_UNIT:
    weight: 16
    level_contribution: high
    description: "Цена за единицу значительно выше рыночной по этому товару"
    description_en: "Unit price is a market outlier for the same product (> Q3 + 1.5*IQR)"

thresholds:
  # Градация: LOW 0-25, MEDIUM 26-45, HIGH 46+
  low_max: 25
  medium_max: 45

# Configurable thresholds per indicator (avoids hardcoding in Python)
indicator_thresholds:
  LOT_SPLITTING:
    min_lots: 5
    max_avg_amount: 5000000
    min_total_sum: 10000000
  SHORT_DEADLINE:
    min_days: 3
  FEW_BIDS:
    max_bids: 2
  RECURRING_WINNER:
    min_contracts: 3
    win_rate_threshold: 0.70
    lookback_days: 730
  NEW_COMPANY_BIG_CONTRACT:
    max_age_days: 365
    min_contract_sum: 10000000
  CAROUSEL_PATTERN:
    min_contracts: 5
    min_unique_suppliers: 3
    max_hhi: 0.45
  OVERDUE_EXECUTION:
    min_overdue_days: 14
    min_overdue_days_long: 30
    long_contract_days: 365
  FINES_PRESENT:
    min_fine_ratio: 0.01
  LATE_BID_SUBMISSION:
    cutoff_minutes: 60
    require_all_late: true
  SUPPLIER_CONCENTRATION:
    min_contracts: 5
    threshold: 0.80
  CUSTOMER_WINNER_CONCENTRATION:
    min_contracts: 5
    threshold: 0.80
  ADDENDUM_VALUE_INCREASE:
    threshold: 0.20
  WIN_MIN_THEN_ADDENDUM:
    max_days: 30
  WEIRD_EXECUTION_TIME:
    min_days: 7
    max_days: 730
  HIGH_PREPAY:
    threshold: 0.50
  SHORT_DISCUSSION_WINDOW:
    min_days: 2
  TINY_WIN_MARGIN:
    threshold_pct: 1.0
  IDENTICAL_BID_PRICES:
    min_duplicate_groups: 1

# Combo boosters: bonus points when dangerous indicator combinations co-occur
combo_boosters:
  - codes: ["LOT_SPLITTING", "FEW_BIDS", "RECURRING_WINNER"]
    bonus: 10
    description: "Split + few bids + recurring winner"
  - codes: ["COMMON_REQUISITES", "IDENTICAL_BID_PRICES"]
    bonus: 8
    description: "Shared contacts + identical prices (collusion)"
  - codes: ["WIN_MIN_THEN_ADDENDUM", "ADDENDUM_VALUE_INCREASE"]
    bonus: 8
    description: "Quick addendum + value increase (win-low-inflate)"
  - codes: ["NEW_COMPANY_BIG_CONTRACT", "RNU_FLAG"]
    bonus: 8
    description: "New company + RNU flag"
  - codes: ["PAYMENT_WITHOUT_ACT", "PAYMENTS_EXCEED_CONTRACT"]
    bonus: 10
    description: "Pay without acts + exceeded contract"
  - codes: ["SHORT_DEADLINE", "LAST_MINUTE_CHANGES", "FEW_BIDS"]
    bonus: 8
    description: "Short deadline + last-minute changes + few bids"
  - codes: ["BANK_DETAILS_REUSE", "COMMON_REQUISITES"]
    bonus: 10
    description: "Shared bank details + shared contacts (shell companies)"
